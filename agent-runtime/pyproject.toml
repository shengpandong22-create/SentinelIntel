[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinelintel-agent-runtime"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.142.4",
  "httpx==0.28.1",
  "langgraph==1.2.14",
  "pydantic==2.13.5",
  "uvicorn==0.54.0",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
